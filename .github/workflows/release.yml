name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Sentry's SwiftPM manifest needs Swift 6.2+ to skip its unstable KSCrash dependency.
      - name: Toolchain
        run: swift --version

      - name: Build
        working-directory: LifeJustHappening
        run: swift build -c release

      - name: Run Tests
        working-directory: LifeJustHappening
        run: swift test

      - name: Build App Bundle
        working-directory: LifeJustHappening
        run: |
          ./build-app.sh

      - name: Create ZIP archive
        working-directory: LifeJustHappening
        run: |
          ditto -c -k --keepParent "lifejusthappening.app" "LifeJustHappening-${{ github.ref_name }}-mac.zip"

      - name: Compute SHA256
        id: sha
        working-directory: LifeJustHappening
        run: |
          SHA=$(shasum -a 256 "LifeJustHappening-${{ github.ref_name }}-mac.zip" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "SHA256: $SHA"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            LifeJustHappening/LifeJustHappening-${{ github.ref_name }}-mac.zip
          body: |
            Rebuilt from scratch: photos go straight into a `lifejusthappening` album in Google Photos, with time, location and camera in the metadata. The gap between photos only counts time you're actually at the Mac (AI agents driving it don't count), cameras follow a priority list, and clamshell without a webcam just skips.

            ## Install
            1. Download **LifeJustHappening-${{ github.ref_name }}-mac.zip** below, unzip, move **lifejusthappening.app** to `/Applications`.
            2. It isn't notarized, so macOS blocks the first launch. Open it once, then **System Settings → Privacy & Security → Open Anyway**. Or run `xattr -dr com.apple.quarantine /Applications/lifejusthappening.app`.
            3. Connect Google Photos: [docs/google-photos-setup.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/google-photos-setup.md).

            This download is ad-hoc signed, so macOS asks for camera/location/Input Monitoring again after each update. Building it yourself with `./build-app.sh` signs it with your own certificate and keeps them.

            ### SHA256
            ```
            ${{ steps.sha.outputs.sha256 }}  LifeJustHappening-${{ github.ref_name }}-mac.zip
            ```
