name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build
        working-directory: LifeJustHappening
        run: swift build -c release

      - name: Run Tests
        working-directory: LifeJustHappening
        run: swift test

      - name: Build App Bundle
        working-directory: LifeJustHappening
        run: |
          chmod +x build-app.sh
          ./build-app.sh

      - name: Create ZIP archive
        working-directory: LifeJustHappening
        run: |
          ditto -c -k --keepParent "lifejusthappening.app" "LifeJustHappening-${{ github.ref_name }}-mac.zip"

      - name: Compute SHA256
        id: sha
        working-directory: LifeJustHappening
        run: |
          SHA=$(shasum -a 256 "LifeJustHappening-${{ github.ref_name }}-mac.zip" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "SHA256: $SHA"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            LifeJustHappening/LifeJustHappening-${{ github.ref_name }}-mac.zip
          body: |
            ## Install

            ### Homebrew
            ```bash
            brew install --cask lifejusthappening
            ```

            ### Manual
            1. Download **LifeJustHappening-${{ github.ref_name }}-mac.zip** below
            2. Unzip and drag **Life Just Happening.app** to `/Applications`
            3. Open it from your Applications folder

            ### SHA256
            ```
            ${{ steps.sha.outputs.sha256 }}  LifeJustHappening-${{ github.ref_name }}-mac.zip
            ```
