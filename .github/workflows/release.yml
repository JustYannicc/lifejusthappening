name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        working-directory: LifeJustHappening
        run: swift build -c release

      - name: Run Tests
        working-directory: LifeJustHappening
        run: swift test

      - name: Build App Bundle
        working-directory: LifeJustHappening
        run: |
          ./build-app.sh

      - name: Create ZIP archive
        working-directory: LifeJustHappening
        run: |
          ditto -c -k --keepParent "lifejusthappening.app" "LifeJustHappening-${{ github.ref_name }}-mac.zip"

      - name: Compute SHA256
        id: sha
        working-directory: LifeJustHappening
        run: |
          SHA=$(shasum -a 256 "LifeJustHappening-${{ github.ref_name }}-mac.zip" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "SHA256: $SHA"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            LifeJustHappening/LifeJustHappening-${{ github.ref_name }}-mac.zip
          body: |
            ## Install
            1. Download **LifeJustHappening-${{ github.ref_name }}-mac.zip** below
            2. Unzip and move **lifejusthappening.app** to `/Applications`
            3. The build is ad-hoc signed, so right-click → Open the first time
            4. Connect Google Photos: see docs/google-photos-setup.md

            ### SHA256
            ```
            ${{ steps.sha.outputs.sha256 }}  LifeJustHappening-${{ github.ref_name }}-mac.zip
            ```
