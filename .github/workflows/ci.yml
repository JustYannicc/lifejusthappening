name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Sentry's SwiftPM manifest needs Swift 6.2+ to skip its unstable KSCrash dependency.
      - name: Toolchain
        run: swift --version

      - name: Build
        working-directory: LifeJustHappening
        run: swift build -c release

      - name: Run Tests
        working-directory: LifeJustHappening
        run: swift test

      - name: Build App Bundle
        working-directory: LifeJustHappening
        run: |
          ./build-app.sh
          test -x lifejusthappening.app/Contents/MacOS/LifeJustHappening
          codesign --verify --deep lifejusthappening.app
