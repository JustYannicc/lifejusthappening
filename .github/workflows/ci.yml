name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build
        working-directory: LifeJustHappening
        run: swift build -c release

      - name: Run Tests
        working-directory: LifeJustHappening
        run: swift test

      - name: Build App Bundle
        working-directory: LifeJustHappening
        run: |
          chmod +x build-app.sh
          ./build-app.sh
          # Verify the bundle was created and Info.plist has no unresolved placeholders
          test -d "Life Just Happening.app"
          ! grep -q '$(EXECUTABLE_NAME)\|$(DEVELOPMENT_LANGUAGE)' "Life Just Happening.app/Contents/Info.plist"
